    <!-- SPA redirect: decodifica la ruta que 404.html guardó en el query y
         restaura la URL real antes de que arranque React Router. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>

      (function () {
        var t = null;
        try {
          t = localStorage.getItem('lubrimec-theme');
        } catch (e) {}
        // Sin preferencia guardada: respetar el tema del sistema
